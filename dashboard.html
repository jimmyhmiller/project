<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Graduation</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191b17;--line:#30342b;--text:#f1f0e8;--muted:#9ca28f;--accent:#d8ff72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1600px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}h1{font-size:30px;margin:0 0 8px}.muted{color:var(--muted)}button,input,select{font:inherit}button{background:var(--accent);color:#15180e;border:0;padding:10px 16px;font-weight:700;cursor:pointer}nav{display:flex;gap:8px;align-items:center}nav button.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}#stats{margin:16px 0}.table{border:1px solid var(--line)}.row{display:grid;grid-template-columns:70px minmax(140px,1fr) minmax(170px,1.2fr) 110px 110px 110px 110px minmax(170px,1fr);gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}.row:first-child{border:0}.head{color:var(--muted);background:#141511;font-size:12px;text-transform:uppercase}.project{background:var(--panel)}.project:not(.candidate){opacity:.55}.project input[type=text],select{width:100%;background:#10110f;color:var(--text);border:1px solid var(--line);padding:8px}.source{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);color:var(--muted)}.candidate .pill{border-color:#68753e;color:var(--accent)}label.check{display:flex;align-items:center;gap:7px}#toast{position:fixed;right:24px;bottom:24px;background:var(--accent);color:#15180e;padding:12px 18px;display:none}@media(max-width:900px){.head{display:none}.row{grid-template-columns:1fr 1fr}.source{grid-column:1/-1}header{display:block}nav{margin-top:18px}}
</style></head><body><main><header><div><h1>Project graduation</h1><div class="muted">Jim activity → KDL registry → one-at-a-time migration</div></div><nav><button class="secondary" onclick="selectVisible()">Select visible</button><button onclick="save()">Save to KDL</button></nav></header><div id="stats" class="muted">Loading…</div><div class="table"><div class="row head"><div>Elevate</div><div>Jim project</div><div>Repo name</div><div>Visibility</div><div>README follow-up</div><div>Experiment</div><div>State</div><div>Last activity / source</div></div><div id="rows"></div></div></main><div id="toast"></div><script>
let projects=[];const rows=document.querySelector('#rows');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){rows.innerHTML=projects.map((p,i)=>`<div class="row project ${p.in_playground?'candidate':''}"><label class="check"><input type="checkbox" ${p.elevate?'checked':''} ${p.in_playground?'':'disabled'} onchange="projects[${i}].elevate=this.checked"> yes</label><div><strong>${esc(p.jim_name)}</strong><br><span class="muted">${p.origin==='filesystem'?'recent filesystem potential':'Jim #'+p.id}${p.hidden?' · hidden':''}</span></div><input type="text" value="${esc(p.name)}" oninput="projects[${i}].name=this.value"><select onchange="projects[${i}].visibility=this.value"><option ${p.visibility==='private'?'selected':''}>private</option><option ${p.visibility==='public'?'selected':''}>public</option></select><label class="check"><input type="checkbox" ${p.readme?'checked':''} onchange="projects[${i}].readme=this.checked"> revisit</label><label class="check"><input type="checkbox" ${p.experiment?'checked':''} onchange="projects[${i}].experiment=this.checked"> explicit</label><span class="pill">${p.origin==='filesystem'?'potential':p.in_playground?'candidate':'registered'}</span><div class="source" title="${esc(p.source)}">${esc(p.last_edit_at||p.last_focus_at||'No activity date')}<br><span class="muted">${esc(p.source||'No working directory')}</span></div></div>`).join('');let c=projects.filter(p=>p.in_playground).length,s=projects.filter(p=>p.elevate).length,f=projects.filter(p=>p.origin==='filesystem').length,x=projects.filter(p=>p.elevate&&p.experiment).length;document.querySelector('#stats').textContent=`${projects.length} total · ${c} in PlayGround · ${f} recent extras · ${s} selected · ${x} explicit experiments`;}
function selectVisible(){projects.forEach(p=>{if(p.in_playground)p.elevate=true});render()}
async function save(){let r=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(projects)});if(!r.ok)throw Error(await r.text());show('Saved decisions to projects.kdl');render()}
function show(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
fetch('/api/projects').then(r=>r.json()).then(p=>{projects=p;render()});
</script></body></html>
